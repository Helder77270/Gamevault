name: Images

# Builds and pushes the ticketd and web images to GitHub Container Registry.
# Manual only (Actions tab > Images > Run workflow): nothing is published
# by a regular push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. 0.1.0)
        required: true
      ticketd_url:
        description: Public ticketd URL baked into the web bundle
        required: true
        default: https://api.gamevault.example

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ticketd, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ inputs.tag }}
          build-args: |
            NEXT_PUBLIC_TICKETD_URL=${{ inputs.ticketd_url }}
            NEXT_PUBLIC_SUBGRAPH_URL=${{ vars.NEXT_PUBLIC_SUBGRAPH_URL }}
            NEXT_PUBLIC_WC_PROJECT_ID=${{ vars.NEXT_PUBLIC_WC_PROJECT_ID }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
