[package]
name = "gamevault-launcher"
version = "0.1.0"
description = "GameVault launcher — reads a license ticket from USB/SD media, verifies ownership, decrypts and runs the game"
authors = ["GameVault"]
edition = "2021"

[lib]
name = "gamevault_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# download manager: blocking HTTP with ranges; no gzip (it would break byte ranges)
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"
k256 = { version = "0.13", features = ["ecdh"] }
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
# windows-native REQUIRED: keyring v3 keystores are opt-in — without the
# feature it silently uses an in-memory mock (a new key per call!)
keyring = { version = "3", features = ["windows-native"] }
getrandom = "0.2"
zeroize = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell"] }

# Crypto stays fast in `tauri dev` too: unoptimized AES-GCM ran at 5 MB/s
# (a 480 MiB game took ~2 min to open, 2026-10-14). AES-GCM is generic, so
# it is compiled inside OUR crate: optimize it too (opt-level 2 keeps debug
# assertions and a reasonable rebuild time), plus the crypto crates.
[profile.dev.package.gamevault-launcher]
opt-level = 2
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
