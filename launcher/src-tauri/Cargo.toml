[package]
name = "gamevault-launcher"
version = "0.1.0"
description = "GameVault launcher — reads a license ticket from USB/SD media, verifies ownership, decrypts and runs the game"
authors = ["GameVault"]
edition = "2021"

[lib]
name = "gamevault_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# download manager: blocking HTTP with ranges; no gzip (it would break byte ranges)
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"
k256 = { version = "0.13", features = ["ecdh"] }
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
# windows-native REQUIRED: keyring v3 keystores are opt-in — without the
# feature it silently uses an in-memory mock (a new key per call!)
keyring = { version = "3", features = ["windows-native"] }
getrandom = "0.2"
base64 = "0.22"
