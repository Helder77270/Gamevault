[package]
name = "gamevault-launcher"
version = "0.1.0"
description = "GameVault launcher — reads a license ticket from USB/SD media, verifies ownership, decrypts and runs the game"
authors = ["GameVault"]
edition = "2021"

[lib]
name = "gamevault_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"
k256 = { version = "0.13", features = ["ecdh"] }
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
