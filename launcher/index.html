<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA-64 · GameVault Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="console">
      <div class="topbar" data-tauri-drag-region>
        <div class="brandrow">
          <div class="logo-chip"></div>
          <div class="logo-text">AURA&#8209;64</div>
          <div class="ver">GAMEVAULT</div>
        </div>
        <nav class="topnav" aria-label="Navigation principale">
          <button class="navbtn" id="nav-home" data-navgo="home">HOME</button>
          <button class="navbtn" id="nav-store" data-navgo="store">BOUTIQUE</button>
          <button class="navbtn" id="nav-shelf" data-navgo="shelf">GAME SHELF</button>
          <button class="navbtn" id="nav-friends" data-navgo="friends">AMIS</button>
          <button class="navbtn" id="nav-downloads" data-navgo="downloads">TÉLÉCHARGEMENTS</button>
        </nav>
        <div class="toprow-right">
          <button class="avbtn" id="nav-profile" data-navgo="profile" aria-label="Profil" title="Profil"></button>
          <button class="gearbtn" id="nav-settings" data-navgo="settings" aria-label="Settings" title="Settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
          <div class="led" id="led-chain" title="Chaîne (Base Sepolia)"></div>
          <div class="led" id="led-ticketd" title="ticketd"></div>
          <div class="led" id="led-card" title="Cartouche"></div>
          <div class="winctl">
            <button class="winbtn" id="win-min" aria-label="Réduire" title="Réduire">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button class="winbtn" id="win-max" aria-label="Agrandir" title="Agrandir">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
            <button class="winbtn close" id="win-close" aria-label="Fermer" title="Fermer">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="screen"></div>
      <div id="overlay-layer"></div>
      <div class="bottombar">
        <div class="slotrow">
          <div class="mini-slot"><div class="mini-slot-line"></div><div class="mini-card" id="mini-card"></div></div>
          <div class="slot-status" id="slot-status">NO CARD</div>
          <div class="vsep"></div>
          <div class="slot-dim" id="slot-detail">SLOT A &nbsp;&#183;&nbsp; —</div>
        </div>
        <div class="clockrow">
          <div class="slot-dim bar-dl" id="bar-dl"></div>
          <div class="slot-dim" id="bar-date"></div>
          <div class="bar-clock" id="bar-clock"></div>
        </div>
      </div>
    </div>
  </body>
</html>
