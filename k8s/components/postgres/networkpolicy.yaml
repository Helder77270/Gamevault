# Postgres: only ticketd and the backup job
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-ticketd
  namespace: gamevault
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: ticketd }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: postgres-backup }
      ports:
        - { protocol: TCP, port: 5432 }
