# Postgres for ticketd (2026-10-11) — the durable state: sessions, nonces,
# encrypted content keys, friends, chat, profiles, avatars, devices.
#
# In-cluster StatefulSet = good for a first deployment and for minikube.
# For real production prefer a MANAGED Postgres (point-in-time recovery,
# failover, backups handled): leave this component out of the overlay and
# set DATABASE_URL in the gamevault-secrets Secret (docs/runbook.md).
#
# Credentials: Secret `postgres-credentials` (key `password`), created by
# Ansible from its vault / by deploy/minikube.ps1 — never in the repo.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gamevault
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: gamevault }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: gamevault }
    spec:
      terminationGracePeriodSeconds: 60 # a clean checkpoint on shutdown
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres user of the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - max_connections=200 # ticketd: PG_POOL_MAX (10) x replicas (HPA max 8) + backups + headroom
            - -c
            - shared_buffers=256MB
            - -c
            - log_min_duration_statement=500 # slow queries in the logs
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: gamevault }
            - { name: POSTGRES_DB, value: gamevault }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          startupProbe:
            exec: { command: [pg_isready, -U, gamevault, -d, gamevault] }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            exec: { command: [pg_isready, -U, gamevault, -d, gamevault] }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            exec: { command: [pg_isready, -U, gamevault, -d, gamevault] }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 20Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gamevault
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
# Nightly logical backup (pg_dump, custom format) onto its own volume,
# kept KEEP_DAYS days. Copy it off the cluster too (object storage) in
# production. Restore procedure: docs/runbook.md. The dumps contain the
# game keys ENCRYPTED — useless without KEYSTORE_MASTER_KEY.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: gamevault
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 20Gi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: gamevault
  labels: { app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: gamevault }
spec:
  schedule: "17 3 * * *" # 03:17 every night
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: gamevault }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: pg-dump
              image: postgres:16.4-alpine
              imagePullPolicy: IfNotPresent
              command: [sh, -c]
              args:
                - |
                  set -eu
                  f="/backups/ticketd-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  pg_dump --format=custom --no-owner -h postgres -U gamevault -d gamevault -f "$f"
                  pg_restore --list "$f" > /dev/null   # the dump is readable
                  find /backups -name 'ticketd-*.dump' -mtime +"$KEEP_DAYS" -delete
                  ls -la /backups
              env:
                - { name: KEEP_DAYS, value: "14" }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: "1", memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: postgres-backups }
            - { name: tmp, emptyDir: {} }
