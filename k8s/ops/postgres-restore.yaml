# Restore a nightly dump (k8s/components/postgres: CronJob postgres-backup)
# — runbook: docs/runbook.md. NOT part of any kustomization: apply by hand.
#
#   1. pick a dump:   kubectl -n gamevault logs job/<last backup job>   (ls of /backups)
#   2. edit DUMP (file name) and TARGET_DB below
#      - TARGET_DB=gamevault_restore  -> restore beside the live data, compare, then switch
#      - TARGET_DB=gamevault          -> overwrite the live database (scale ticketd to 0 first)
#   3. kubectl apply -f k8s/ops/postgres-restore.yaml && kubectl -n gamevault logs -f job/postgres-restore
#   4. kubectl -n gamevault delete job postgres-restore
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore
  namespace: gamevault
  labels: { app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: gamevault } # allowed to reach Postgres
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-backup, app.kubernetes.io/part-of: gamevault }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pg-restore
          image: postgres:16.4-alpine
          command: [sh, -c]
          args:
            - |
              set -eu
              test -f "/backups/$DUMP" || { echo "dump introuvable : $DUMP"; ls -la /backups; exit 1; }
              if [ "$TARGET_DB" != "gamevault" ]; then
                psql -h postgres -U gamevault -d gamevault -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $TARGET_DB" -c "CREATE DATABASE $TARGET_DB"
              fi
              pg_restore --clean --if-exists --no-owner -h postgres -U gamevault -d "$TARGET_DB" "/backups/$DUMP"
              echo "restauré dans $TARGET_DB :"
              psql -h postgres -U gamevault -d "$TARGET_DB" -At -c "SELECT 'content_keys', COUNT(*) FROM content_keys UNION ALL SELECT 'profiles', COUNT(*) FROM profiles UNION ALL SELECT 'friendships', COUNT(*) FROM friendships UNION ALL SELECT 'messages', COUNT(*) FROM messages UNION ALL SELECT 'sessions', COUNT(*) FROM sessions UNION ALL SELECT 'avatars', COUNT(*) FROM avatars"
          env:
            - { name: DUMP, value: "ticketd-YYYYMMDDTHHMMSSZ.dump" }
            - { name: TARGET_DB, value: gamevault_restore }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: backups, mountPath: /backups, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: backups
          persistentVolumeClaim: { claimName: postgres-backups }
        - { name: tmp, emptyDir: {} }
