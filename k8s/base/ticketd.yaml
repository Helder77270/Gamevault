# ticketd — ONE replica, on purpose. It keeps state that is not shared yet:
# SQLite (sessions, nonces, keys, social), presence + live SSE streams and
# pending pairing tickets in memory. Two replicas would split that state
# (a nonce replayed on the other pod, a chat event that never arrives).
# Scaling it out = the next chantier: Postgres + Redis (docs/infra.md).
# Until then: StatefulSet, persistent volume, Recreate-style rollout, and
# Kubernetes restarts the pod as soon as a probe fails.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ticketd
  namespace: gamevault
  labels: { app.kubernetes.io/name: ticketd, app.kubernetes.io/part-of: gamevault }
spec:
  serviceName: ticketd
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy: { type: RollingUpdate }
  selector:
    matchLabels: { app.kubernetes.io/name: ticketd }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ticketd, app.kubernetes.io/part-of: gamevault }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ticketd
          image: ghcr.io/gamevault/ticketd:0.1.0 # set by kustomize `images:` / Ansible
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8787 }
          envFrom:
            - configMapRef: { name: ticketd-config }
            - secretRef: { name: gamevault-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi } # big builds are streamed, but a manifest hash reads 1 MiB at a time
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe: # stuck event loop -> restart
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe: # out of the Service while it can't answer
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /app/ticketd/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 50Gi } # SQLite + avatars + build cache (a 500 MB game per edition)
---
apiVersion: v1
kind: Service
metadata:
  name: ticketd
  namespace: gamevault
  labels: { app.kubernetes.io/name: ticketd }
spec:
  selector: { app.kubernetes.io/name: ticketd }
  ports:
    - { name: http, port: 8787, targetPort: http }
