# web — the Next.js marketplace. Stateless (wallet state lives in the
# browser, data comes from the chain, the subgraph and ticketd): it scales
# out freely behind the Service; the HPA follows CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: gamevault
  labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: gamevault }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } # never below capacity during a deploy
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web, app.kubernetes.io/part-of: gamevault }
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # spread replicas over nodes: a node loss never takes the site down
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: web }
      containers:
        - name: web
          image: ghcr.io/gamevault/web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: "0.0.0.0" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: gamevault
  labels: { app.kubernetes.io/name: web }
spec:
  selector: { app.kubernetes.io/name: web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: gamevault
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # no flapping after a spike
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: gamevault
spec:
  minAvailable: 1 # node drains/upgrades keep at least one replica serving
  selector:
    matchLabels: { app.kubernetes.io/name: web }
