# EXAMPLE ONLY — never commit real values. Ansible renders the real Secret
# from its encrypted vault (deploy/ansible/group_vars/vault.yml). Not part
# of kustomization.yaml on purpose.
apiVersion: v1
kind: Secret
metadata:
  name: gamevault-secrets
  namespace: gamevault
type: Opaque
stringData:
  TICKET_SIGNER_PRIVKEY: "0x…"     # platform key that signs tickets (public key embedded in the launcher)
  ATTEST_SIGNER_PRIVKEY: "0x…"     # signs lending attestations checked by GameLicense
  KEYSTORE_MASTER_KEY: "…"         # encrypts content keys at rest — losing it loses every game key
  PINATA_JWT: "…"                  # IPFS pinning (studio publish)
  # DATABASE_URL: "postgres://…"  # ONLY with a managed Postgres (then drop postgres.yaml)
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: gamevault
type: Opaque
stringData:
  password: "…"                    # URL-safe (hex): it is put inside DATABASE_URL
