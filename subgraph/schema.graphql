type Studio @entity(immutable: false) {
  id: ID!
  owner: Bytes!
  name: String!
  games: [Game!]! @derivedFrom(field: "studio")
}

type Game @entity(immutable: false) {
  id: ID!
  studio: Studio!
  title: String!
  editions: [Edition!]! @derivedFrom(field: "game")
}

type Edition @entity(immutable: false) {
  id: ID!
  game: Game!
  supply: BigInt!
  price: BigInt!
  royaltyBps: BigInt!
  # studio choice at creation: false = copies can never change hands
  resellable: Boolean!
  buildCid: String!
  buildHash: Bytes!
  minted: BigInt!
  licenses: [License!]! @derivedFrom(field: "edition")
}

type License @entity(immutable: false) {
  id: ID!
  edition: Edition
  owner: Bytes!
  mintedAt: BigInt!
  listed: Boolean!
  listPrice: BigInt
  "Current borrower while a loan runs (ERC-4907 userOf), null otherwise"
  borrower: Bytes
  loanExpires: BigInt
  transfers: [Transfer!]! @derivedFrom(field: "license")
  loans: [Loan!]! @derivedFrom(field: "license")
  royaltyPayments: [RoyaltyPayment!]! @derivedFrom(field: "license")
}

type Transfer @entity(immutable: true) {
  id: ID!
  license: License!
  from: Bytes!
  to: Bytes!
  timestamp: BigInt!
  txHash: Bytes!
}

type RoyaltyPayment @entity(immutable: true) {
  id: ID!
  license: License!
  seller: Bytes!
  buyer: Bytes!
  salePrice: BigInt!
  royaltyAmount: BigInt!
  platformFee: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"One UpdateUser event: a loan starts (user set) or ends (user = 0x0, expires = 0)"
type Loan @entity(immutable: true) {
  id: ID!
  license: License!
  owner: Bytes!
  borrower: Bytes!
  expires: BigInt!
  ended: Boolean!
  timestamp: BigInt!
  txHash: Bytes!
}

"Marketplace shares a receiver could not take directly (audit K4) — claimable with withdraw()"
type PendingPayout @entity(immutable: false) {
  id: ID!
  payee: Bytes!
  pending: BigInt!
  totalCredited: BigInt!
  totalWithdrawn: BigInt!
}
