# Addresses + startBlock: paste after P1 deployment (same moment as
# shared/src/deployments.ts), then `npm run build -w subgraph` and deploy.
specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: GameRegistry
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: GameRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Studio, Game, Edition]
      abis:
        - name: GameRegistry
          file: ./abis/GameRegistry.json
      eventHandlers:
        - event: StudioRegistered(indexed uint256,indexed address,string)
          handler: handleStudioRegistered
        - event: GameCreated(indexed uint256,indexed uint256,string)
          handler: handleGameCreated
        - event: EditionCreated(indexed uint256,indexed uint256,uint256,uint256,uint96,string,bytes32)
          handler: handleEditionCreated
      file: ./src/mapping.ts
  - kind: ethereum
    name: GameLicense
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: GameLicense
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [License, Transfer, Edition]
      abis:
        - name: GameLicense
          file: ./abis/GameLicense.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: LicenseMinted(indexed uint256,indexed uint256,indexed address)
          handler: handleLicenseMinted
      file: ./src/mapping.ts
  - kind: ethereum
    name: Marketplace
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: Marketplace
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [License, RoyaltyPayment]
      abis:
        - name: Marketplace
          file: ./abis/Marketplace.json
      eventHandlers:
        - event: Listed(indexed uint256,indexed address,uint256)
          handler: handleListed
        - event: Unlisted(indexed uint256)
          handler: handleUnlisted
        - event: Sale(indexed uint256,indexed address,indexed address,uint256,uint256,uint256)
          handler: handleSale
      file: ./src/mapping.ts
