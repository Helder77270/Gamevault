# Addresses + startBlock mirror shared/src/deployments.ts — update both
# together, then `npm run build -w @gamevault/subgraph` and deploy.
# v1.1 full reset (2026-10-08, block 47862131): 8 % primary fee,
# resale optional per edition (Edition.resellable).
specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: GameRegistry
    network: base-sepolia
    source:
      address: "0x713072aB1826f4608B0a26a441F2FF954F9243E6"
      abi: GameRegistry
      startBlock: 47862131
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [Studio, Game, Edition]
      abis:
        - name: GameRegistry
          file: ./abis/GameRegistry.json
      eventHandlers:
        - event: StudioRegistered(indexed uint256,indexed address,string)
          handler: handleStudioRegistered
        - event: GameCreated(indexed uint256,indexed uint256,string)
          handler: handleGameCreated
        - event: EditionCreated(indexed uint256,indexed uint256,uint256,uint256,uint96,bool,string,bytes32)
          handler: handleEditionCreated
      file: ./src/mapping.ts
  - kind: ethereum
    name: GameLicense
    network: base-sepolia
    source:
      address: "0x844cb5292c7Fe7a186F1dF0914f2463c7fFC3fE8"
      abi: GameLicense
      startBlock: 47862131
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [License, Transfer, Edition, Loan]
      abis:
        - name: GameLicense
          file: ./abis/GameLicense.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: LicenseMinted(indexed uint256,indexed uint256,indexed address)
          handler: handleLicenseMinted
        - event: UpdateUser(indexed uint256,indexed address,uint64)
          handler: handleUpdateUser
      file: ./src/mapping.ts
  - kind: ethereum
    name: Marketplace
    network: base-sepolia
    source:
      address: "0x0E16549E5282a91C5bA189da67D9E7eC57BE0632"
      abi: Marketplace
      startBlock: 47862131
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities: [License, RoyaltyPayment, PendingPayout]
      abis:
        - name: Marketplace
          file: ./abis/Marketplace.json
      eventHandlers:
        - event: Listed(indexed uint256,indexed address,uint256)
          handler: handleListed
        - event: Unlisted(indexed uint256)
          handler: handleUnlisted
        - event: Sale(indexed uint256,indexed address,indexed address,uint256,uint256,uint256)
          handler: handleSale
        - event: PaymentCredited(indexed address,uint256)
          handler: handlePaymentCredited
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn
      file: ./src/mapping.ts
