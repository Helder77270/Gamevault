# Copy to inventory.ini and put your servers (Ubuntu 22.04/24.04, SSH key).
# One server runs the k3s control plane (and workloads); agents add
# capacity. Three nodes = the web replicas survive a node loss.
[k3s_server]
node1 ansible_host=203.0.113.10

[k3s_agents]
node2 ansible_host=203.0.113.11
node3 ansible_host=203.0.113.12

[k3s:children]
k3s_server
k3s_agents

[k3s:vars]
ansible_user=ubuntu
ansible_become=true
