# k3s control plane. Traefik is disabled: the manifests use ingress-nginx
# (rate-limit annotations), installed by the `platform` role. Secrets are
# encrypted at rest in the datastore.
- name: Is k3s already installed at the pinned version?
  ansible.builtin.command: k3s --version
  register: k3s_present
  changed_when: false
  failed_when: false

- name: Install the k3s server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server \
      --disable traefik \
      --write-kubeconfig-mode 0600 \
      --secrets-encryption \
      --tls-san {{ ansible_host }}
  args:
    executable: /bin/bash
  when: k3s_version not in (k3s_present.stdout | default(''))

- name: Wait for the API server
  ansible.builtin.command: k3s kubectl get --raw /readyz
  register: readyz
  retries: 30
  delay: 5
  until: readyz.rc == 0 and 'ok' in readyz.stdout
  changed_when: false

- name: Read the node join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  no_log: true

- name: Share the token with the agents
  ansible.builtin.set_fact:
    k3s_join_token: "{{ k3s_token_raw.content | b64decode | trim }}"
  no_log: true

- name: kubectl for root
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
    force: false
